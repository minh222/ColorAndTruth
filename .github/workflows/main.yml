name: Build & Push Docker

on:
  push:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: ./BE
          push: true
          tags: minh123333/colorandtruth:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Trigger Railway Redeploy
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query": "mutation { serviceInstanceDeploy(environmentId: \"e8c2e4b1-7ab8-4c24-be12-69dbbc2c1cde\", serviceId: \"3652f8d8-8f78-4007-a968-771bcd630d32\") }"}' \
            https://backboard.railway.app/graphql/v2